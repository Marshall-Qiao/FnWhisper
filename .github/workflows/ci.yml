name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run core tests
        run: ./scripts/test.sh

      - name: Build Swift package
        run: swift build

      - name: Build and sign app bundle
        run: ./scripts/build-app.sh
